[project]
name = "webtool"
version = "0.2.0"
description = "Configurable web search + fetch, exposed as a CLI and an MCP server."
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.2,<3",
  "httpx",
  "uvicorn",
  "trafilatura",   # fetch=plain
  "markdownify",   # fetch=playwright
]

[project.optional-dependencies]
# 重依赖按需安装：只用 lexical + plain 时不需要 torch / chromium
crawl4ai   = ["crawl4ai"]
playwright = ["playwright"]
rerank     = ["sentence-transformers"]   # rerank=cross
all        = ["crawl4ai", "playwright", "sentence-transformers"]
dev        = ["pytest"]

[project.scripts]
webtool = "webtool.__main__:main"
webtool-mcp = "webtool.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["webtool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
